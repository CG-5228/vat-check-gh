name: Bug report
description: Report a reproducible problem with the checker
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic amounts only. Do not attach statements, credentials, account numbers or private identity details. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page, data date and a small synthetic example.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system and version or commit
    validations:
      required: true
