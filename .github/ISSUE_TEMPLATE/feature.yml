name: Feature request
description: Suggest a focused improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
      description: Describe the user benefit and any public source evidence needed.
    validations:
      required: true
